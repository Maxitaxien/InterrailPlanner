name: interrail-helper
services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://interrail:${POSTGRES_PASSWORD:?Create .env with POSTGRES_PASSWORD first}@db:5432/interrail
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:14b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-false}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      LLM_NUM_PREDICT: ${LLM_NUM_PREDICT:-2048}
      LLM_THINKING: ${LLM_THINKING:-false}
      ALLABOARD_ENABLED: ${ALLABOARD_ENABLED:-false}
      ALLABOARD_API_KEY: ${ALLABOARD_API_KEY:-}
      ALLABOARD_ENVIRONMENT: ${ALLABOARD_ENVIRONMENT:-test}
      ALLABOARD_TIMEOUT_SECONDS: ${ALLABOARD_TIMEOUT_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  db:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_DB: interrail
      POSTGRES_USER: interrail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env with POSTGRES_PASSWORD first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interrail -d interrail"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.12.3@sha256:c622a7adec67cf5bd7fe1802b7e26aa583a955a54e91d132889301f50c3e0bd0
    volumes:
      - ollama_data:/root/.ollama
    gpus: all
    restart: unless-stopped
volumes:
  postgres_data:
  ollama_data:
