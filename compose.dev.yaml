name: interrail-helper

services:
  frontend:
    build:
      context: ./frontend
      target: development
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      API_INTERNAL_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  frontend_node_modules:
  frontend_next:
